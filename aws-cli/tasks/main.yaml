- name: Download the awscli bundle.
  ansible.builtin.get_url:
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.0.30.zip
    dest: /tmp/awscliv2.zip
    mode: '0644'
  register: aws_cli_download_bundle

- name: Unarchive the installer.  # noqa: no-handler
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    copy: false
    creates: /tmp/aws
  when: aws_cli_download_bundle.changed
  register: aws_cli_unarchive_installer

- name: Install awscli package.  # noqa: no-handler
  ansible.builtin.command: /tmp/aws/install
  args:
    creates: /usr/local/bin/aws
  when: aws_cli_unarchive_installer.changed

- name: Install aws session-manager-plugin for Debian/Ubuntu.
  ansible.builtin.include_tasks: debian.yaml
  when: ansible_os_family == 'Debian'

- name: Install aws session-manager-plugin for RedHat/RHEL.
  ansible.builtin.dnf:
    name: https://s3.amazonaws.com/session-manager-downloads/plugin/latest/linux_64bit/session-manager-plugin.rpm
    disable_gpg_check: true
    state: present
  when: ansible_os_family == 'RedHat'
