---

- name: Set binary directory
  ansible.builtin.set_fact:
    local_bindir: "/usr/local/bin"

- name: Task information
  ansible.builtin.debug:
    msg:
      - "Checking {{ local_bindir }}/packer"

- name: Check installed version
  ansible.builtin.shell:
    cmd: |
      if [[ -f {{ local_bindir }}/packer ]]; then
        {{ local_bindir }}/packer --version 2>&1
      else
        echo "0"
      fi
    executable: /bin/bash
  register: installed_version
  changed_when: false

- name: Show latest versions
  ansible.builtin.debug:
    msg:
      - "Requested packer version: '{{ packer_version }}'"
      - "Installed packer version: '{{ installed_version.stdout }}'"

- name: Do we need to install?
  ansible.builtin.set_fact:
    do_install: "{{ installed_version.stdout is version(packer_version, '<') }}"

- name: Show do_install to see if we need to install
  ansible.builtin.debug:
    msg: "{{ do_install }}"

- name: Install packer
  when: do_install
  block:
    - name: Create temp folder
      ansible.builtin.tempfile:
        state: directory
        prefix: packer
      register: tempdir
    - name: Download
      ansible.builtin.get_url:
        url: https://releases.hashicorp.com/packer/{{ packer_version }}/packer_{{ packer_version }}_linux_amd64.zip
        dest: "{{ tempdir.path }}/packer.zip"
        mode: "0777"
    - name: Extract
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ tempdir.path }}/packer.zip"
        dest: "{{ tempdir.path }}"
        creates: "{{ tempdir.path }}/packer"
    - name: Copy
      ansible.builtin.copy:
        remote_src: true
        src: "{{ tempdir.path }}/packer"
        dest: "{{ local_bindir }}/packer"
        mode: "0755"
    - name: Cleanup
      ansible.builtin.file:
        path: "{{ tempdir.path }}"
        state: absent
